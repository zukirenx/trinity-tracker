name = "lw-discord-bot"
main = "src/index.ts"
compatibility_date = "2024-01-01"

[[d1_databases]]
binding = "DB"
database_name = "lw-rewards"
# Created with `npx wrangler d1 create lw-rewards` — paste your own ID here.
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"

[triggers]
# Fri/Sat 00:00 UTC open next week's registrations; daily 02:00 UTC is
# midnight at UTC-2 (game-server time) and auto-locks closed registrations.
crons = ["0 0 * * FRI", "0 0 * * SAT", "0 2 * * *"]

# Environment variables (set these with: wrangler secret put SECRET_NAME)
# - DISCORD_PUBLIC_KEY
# - DISCORD_BOT_TOKEN
# - DISCORD_APPLICATION_ID
# - TRACKING_CHANNEL_ID
# - ROSTER_CHANNEL_ID (optional — falls back to TRACKING_CHANNEL_ID)
# - GUILD_ID
# - WEB_ACCESS_TOKEN (optional — admin dashboard token)
# - WEB_READONLY_TOKEN (optional — read-only dashboard token)
# - WORKER_URL (optional — public worker URL used in auto-posts)
